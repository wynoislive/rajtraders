services:
  # ─── 1. PostgreSQL 16 Database ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rajtraders-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rajtraders}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-RajTradersSecurePass2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rajtraders}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  # ─── 2. Redis 7 High-Speed In-Memory Cache & Limiter ─────────
  redis:
    image: redis:7-alpine
    container_name: rajtraders-redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-RajTradersRedisPass2026!}" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RajTradersRedisPass2026!}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal-net

  # ─── 3. Node.js API Server Gateway ───────────────────────────
  api:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    container_name: rajtraders-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-RajTradersSecurePass2026!}@postgres:5432/${POSTGRES_DB:-rajtraders}
      REDIS_URL: redis://:${REDIS_PASSWORD:-RajTradersRedisPass2026!}@redis:6379
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sundarvan.xyz,https://admin.sundarvan.xyz}
      BODY_SIZE_LIMIT: 2mb
      RATE_LIMIT_GLOBAL: 200
      RATE_LIMIT_AUTH: 10
      RATE_LIMIT_CHECKOUT: 20
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal-net
    expose:
      - "8080"

  # ─── 4. Nginx Reverse Proxy & Cloudflare CDN Edge Cache ───────
  nginx:
    image: nginx:alpine
    container_name: rajtraders-nginx
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - uploads_data:/var/www/uploads:ro
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
