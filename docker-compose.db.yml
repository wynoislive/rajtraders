services:
  # ─── 1. PostgreSQL 16 Primary (Read-Write Master) ───────────
  postgres-primary:
    image: postgres:16-alpine
    container_name: rajtraders-postgres-primary
    restart: always
    environment:
      POSTGRES_DB: rajtraders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rajtraders_vps_master_2026}
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${REPL_PASSWORD:-rajtraders_repl_secret_2026}
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=10
        -c max_replication_slots=10
        -c hot_standby=on
        -c wal_keep_size=1024MB
        -c listen_addresses='*'
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./scripts/vps/init-primary-replication.sh:/docker-entrypoint-initdb.d/init-primary-replication.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rajtraders"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 2. PostgreSQL 16 Replica (Read-Only Standby) ──────────
  postgres-replica:
    image: postgres:16-alpine
    container_name: rajtraders-postgres-replica
    restart: always
    environment:
      PGUSER: replicator
      PGPASSWORD: ${REPL_PASSWORD:-rajtraders_repl_secret_2026}
      PRIMARY_HOST: postgres-primary
    depends_on:
      postgres-primary:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo 'Initializing standby replica from primary cluster...';
          rm -rf /var/lib/postgresql/data/*;
          until PGPASSWORD=$$PGPASSWORD pg_basebackup -h $$PRIMARY_HOST -p 5432 -U $$PGUSER -D /var/lib/postgresql/data -Fp -Xs -R; do
            echo 'Waiting for primary WAL sender...';
            sleep 2;
          done;
          echo 'Standby backup complete. Starting read replica...';
        fi;
        exec postgres -c hot_standby=on -c listen_addresses='*'
      "
    volumes:
      - pg-replica-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rajtraders"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 3. PgBouncer Primary Pool (Writes, Tx, Sticky: Port 6432) ──
  pgbouncer-primary:
    image: edoburu/pgbouncer:v1.22.1
    container_name: rajtraders-pgbouncer-primary
    restart: always
    environment:
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-rajtraders_vps_master_2026}
      DB_HOST: postgres-primary
      DB_PORT: "5432"
      DB_NAME: rajtraders
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "300"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      SERVER_IDLE_TIMEOUT: "60"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "6432:5432"

  # ─── 4. PgBouncer Replica Pool (Read Queries: Port 6433) ──
  pgbouncer-replica:
    image: edoburu/pgbouncer:v1.22.1
    container_name: rajtraders-pgbouncer-replica
    restart: always
    environment:
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-rajtraders_vps_master_2026}
      DB_HOST: postgres-replica
      DB_PORT: "5432"
      DB_NAME: rajtraders
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "600"
      DEFAULT_POOL_SIZE: "40"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      SERVER_IDLE_TIMEOUT: "60"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres-replica:
        condition: service_healthy
    ports:
      - "6433:5432"

volumes:
  pg-primary-data:
  pg-replica-data:
